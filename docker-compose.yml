version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: cx_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: cx_secret_password
      POSTGRES_DB: cx_platform
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./03_ai_agent_core
    container_name: cx_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db
    # Note: We are using host networking for Ollama access later, but for now, standard port mapping works.
    environment:
      - LLM_PROVIDER=ollama

  frontend:
    build: ./04_fullstack_app
    container_name: cx_frontend
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: