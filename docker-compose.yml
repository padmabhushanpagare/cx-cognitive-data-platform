services:
  postgres_db:
    image: postgres:15-alpine
    container_name: cx_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cx_secret_password}
      POSTGRES_DB: ${DB_NAME:-cx_platform}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: cx_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 8.8.4.4

  api:
    build: ./03_ai_agent_core
    container_name: cx_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres_db
      - ollama
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-cx_secret_password}
      - DB_NAME=${DB_NAME:-cx_platform}
    volumes:
      - chroma_data:/app/chroma_db
    dns:
      - 8.8.8.8
      - 8.8.4.4

  frontend:
    build: ./04_fullstack_app
    container_name: cx_frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-admin}               # <--- ADDED
      - DB_PASSWORD=${DB_PASSWORD:-cx_secret_password} # <--- ADDED
      - DB_NAME=${DB_NAME:-cx_platform}         # <--- ADDED
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  postgres_data:
  ollama_data:
  chroma_data: